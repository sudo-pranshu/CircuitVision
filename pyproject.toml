[project]
name = "circuitvision"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["opencv-python<5", "numpy", "pillow"]   # OpenCV 5 has no cv2.HOGDescriptor (orientation.py)

[project.optional-dependencies]
detect = ["ultralytics==8.4.184", "easyocr==1.7.2"]   # versions the pipeline was tested with
app = ["gradio>=5", "segno>=1.6"]   # segno: QR code for the phone link
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
